name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.24.0)
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sign-notarize-and-package:
    if: github.repository == 'dyd4dsh7/UpKeep' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Test before loading signing credentials
        run: swift test -Xswiftc -warnings-as-errors
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          : "${DEVELOPER_ID_P12_BASE64:?Configure the release environment signing secrets}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing certificate password}"
          : "${KEYCHAIN_PASSWORD:?Missing temporary keychain password}"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/upkeep-signing.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$DEVELOPER_ID_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          rm -f "$certificate_path"
      - name: Configure notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          : "${APPLE_ID:?Missing notarization Apple ID}"
          : "${APPLE_TEAM_ID:?Missing Apple team ID}"
          : "${NOTARY_PASSWORD:?Missing app-specific notarization password}"
          xcrun notarytool store-credentials upkeep-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
      - name: Sign, notarize, and validate
        env:
          UPKEEP_SIGNING_IDENTITY: ${{ secrets.UPKEEP_SIGNING_IDENTITY }}
          UPKEEP_NOTARY_PROFILE: upkeep-ci
        run: ./scripts/release.sh
      - name: Checksums and release notes
        run: |
          (cd outputs && shasum -a 256 Upkeep.zip > Upkeep.zip.sha256)
          python3 scripts/release-notes.py "$RELEASE_TAG" > outputs/release-notes.md
      - name: Upload verified distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Upkeep-${{ env.RELEASE_TAG }}
          path: |
            outputs/Upkeep.zip
            outputs/Upkeep.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" outputs/Upkeep.zip outputs/Upkeep.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Upkeep $RELEASE_TAG" --notes-file outputs/release-notes.md
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          if [ -f "$RUNNER_TEMP/upkeep-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/upkeep-signing.keychain-db"
          fi
