name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  sign-notarize-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/upkeep-signing.keychain-db"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
      - name: Configure notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials upkeep-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
      - name: Test
        run: swift test
      - name: Sign, notarize, and validate
        env:
          UPKEEP_SIGNING_IDENTITY: ${{ secrets.UPKEEP_SIGNING_IDENTITY }}
          UPKEEP_NOTARY_PROFILE: upkeep-ci
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Upkeep
          path: outputs/Upkeep.zip
          if-no-files-found: error
